<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Hexa Sort - Isometric Hex Puzzle</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬡</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06070d;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #101221 0%, #06070d 100%);
      }

      #game-wrapper {
        position: relative;
        width: 480px;
        height: 800px;
        transform-origin: center center;
        box-shadow: 0 0 50px rgba(0, 240, 255, 0.12);
        overflow: hidden;
        border-radius: 12px;
        background: #0a0b14;
      }

      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 480px;
        height: 800px;
        display: block;
      }

      /* --- Top HUD --- */
      #hud-header {
        position: absolute;
        top: 10px;
        left: 14px;
        right: 14px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        z-index: 10;
      }

      .hud-score-panel {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .hud-box {
        background: rgba(14, 16, 28, 0.9);
        border: 1px solid rgba(0, 240, 255, 0.4);
        border-radius: 8px;
        padding: 3px 8px;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
      }

      .hud-best-box {
        border-color: rgba(255, 0, 127, 0.4);
        box-shadow: 0 0 10px rgba(255, 0, 127, 0.15);
      }

      .hud-label {
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: #00f0ff;
        text-transform: uppercase;
      }

      .hud-best-box .hud-label {
        color: #ff007f;
      }

      .hud-val {
        font-size: 15px;
        font-weight: 900;
        color: #ffffff;
      }

      /* --- Center Level & Goal Panel --- */
      .hud-center-goal {
        flex: 1;
        max-width: 200px;
        margin: 0 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        background: rgba(14, 16, 28, 0.92);
        border: 1px solid rgba(0, 240, 255, 0.35);
        border-radius: 10px;
        padding: 5px 10px;
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.2);
      }

      .level-badge {
        font-size: 11px;
        font-weight: 900;
        color: #ffd000;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .goal-bar-wrap {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(0, 240, 255, 0.3);
      }

      .goal-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00f0ff, #00ff66);
        border-radius: 4px;
        transition: width 0.25s ease-out;
        box-shadow: 0 0 8px #00ff66;
      }

      .goal-text {
        font-size: 9px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      /* --- Controls --- */
      .hud-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }

      .hud-icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: rgba(18, 20, 34, 0.9);
        border: 1px solid rgba(0, 240, 255, 0.4);
        color: #ffffff;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
      }

      .hud-icon-btn:hover {
        background: rgba(0, 240, 255, 0.2);
        border-color: #00f0ff;
        transform: scale(1.05);
      }

      .hud-icon-btn:active {
        transform: scale(0.95);
      }

      /* --- Hammer Mode Floating Banner --- */
      #banner-hammer {
        display: none;
        position: absolute;
        top: 86px;
        left: 14px;
        right: 14px;
        background: linear-gradient(90deg, rgba(255, 0, 80, 0.95), rgba(200, 0, 50, 0.95));
        border: 1.5px solid #ff3366;
        border-radius: 10px;
        padding: 8px 12px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 800;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 0 20px rgba(255, 0, 80, 0.5);
        z-index: 12;
      }

      #btn-cancel-hammer {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 6px;
        color: #ffffff;
        font-size: 10px;
        font-weight: 900;
        padding: 4px 8px;
        cursor: pointer;
      }

      /* --- Bottom Action Power-up Buttons --- */
      #hud-actions {
        position: absolute;
        bottom: 12px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        z-index: 10;
        pointer-events: auto;
      }

      .powerup-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 8px 4px;
        background: linear-gradient(135deg, rgba(20, 22, 38, 0.95), rgba(12, 13, 24, 0.95));
        border: 1.5px solid rgba(0, 240, 255, 0.4);
        border-radius: 10px;
        color: #ffffff;
        font-family: inherit;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }

      .powerup-btn:hover {
        border-color: #00f0ff;
        background: linear-gradient(135deg, rgba(30, 32, 54, 0.95), rgba(18, 20, 34, 0.95));
        transform: translateY(-2px);
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
      }

      .powerup-btn:active {
        transform: translateY(1px);
      }

      .powerup-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        border-color: rgba(255, 255, 255, 0.15);
        transform: none;
        box-shadow: none;
      }

      .powerup-btn-hammer {
        border-color: rgba(255, 50, 80, 0.5);
      }
      .powerup-btn-hammer:hover {
        border-color: #ff3250;
        box-shadow: 0 0 16px rgba(255, 50, 80, 0.4);
      }

      .powerup-btn-swap {
        border-color: rgba(0, 255, 128, 0.5);
      }
      .powerup-btn-swap:hover {
        border-color: #00ff80;
        box-shadow: 0 0 16px rgba(0, 255, 128, 0.4);
      }

      .powerup-btn-unlock {
        border-color: rgba(255, 208, 0, 0.5);
      }
      .powerup-btn-unlock:hover {
        border-color: #ffd000;
        box-shadow: 0 0 16px rgba(255, 208, 0, 0.4);
      }

      .ad-tag {
        font-size: 7.5px;
        font-weight: 900;
        letter-spacing: 0.8px;
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(255, 208, 0, 0.2);
        color: #ffd000;
        border: 1px solid rgba(255, 208, 0, 0.4);
      }

      /* --- Modals Overlay --- */
      .modal-backdrop {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 6, 12, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal-card {
        width: 380px;
        background: linear-gradient(145deg, #16182c, #0c0e1a);
        border: 1.5px solid rgba(0, 240, 255, 0.4);
        border-radius: 18px;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
        box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
        animation: modalIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .modal-title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
      }

      .modal-title-danger {
        color: #ff3366;
        text-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
      }

      .modal-subtitle {
        font-size: 12px;
        font-weight: 700;
        color: #8c93b3;
        letter-spacing: 1px;
      }

      .modal-stats {
        width: 100%;
        display: flex;
        justify-content: space-around;
        background: rgba(10, 11, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
      }

      .modal-stat-item {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .modal-stat-label {
        font-size: 9px;
        font-weight: 800;
        color: #00f0ff;
        letter-spacing: 1px;
      }

      .modal-stat-val {
        font-size: 20px;
        font-weight: 900;
        color: #ffffff;
      }

      .modal-btn-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .modal-btn {
        width: 100%;
        padding: 13px 16px;
        border-radius: 12px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.15s ease;
      }

      .btn-primary {
        background: linear-gradient(90deg, #00f0ff, #0077ff);
        border: none;
        color: #ffffff;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
      }

      .btn-revive {
        background: linear-gradient(90deg, #ff007f, #b000ff);
        border: none;
        color: #ffffff;
        box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      }

      .btn-revive:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
      }

      .btn-secondary {
        background: rgba(22, 24, 40, 0.9);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game-wrapper">
        <canvas id="game-canvas" width="480" height="800"></canvas>

        <!-- Top Arcade HUD -->
        <header id="hud-header">
          <div class="hud-score-panel">
            <div class="hud-box">
              <div class="hud-label">SCORE</div>
              <div id="score-display" class="hud-val">0</div>
            </div>
            <div class="hud-box hud-best-box">
              <div class="hud-label">BEST</div>
              <div id="best-display" class="hud-val">0</div>
            </div>
          </div>

          <div class="hud-center-goal">
            <div id="level-display" class="level-badge">LEVEL 1</div>
            <div class="goal-bar-wrap">
              <div id="goal-bar-fill" class="goal-bar-fill"></div>
            </div>
            <div id="goal-text" class="goal-text">GOAL: 0 / 40</div>
          </div>

          <div class="hud-controls">
            <button id="btn-sound" class="hud-icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
              🔊
            </button>
          </div>
        </header>

        <!-- Hammer Mode Floating Banner -->
        <div id="banner-hammer">
          <span>🔨 Tap any stack on the board to smash it!</span>
          <button id="btn-cancel-hammer">CANCEL</button>
        </div>

        <!-- Bottom Rewarded Power-up Buttons -->
        <div id="hud-actions">
          <button id="btn-hammer" class="powerup-btn powerup-btn-hammer" title="Smash any stack to free space">
            <span>🔨 Hammer</span>
            <span class="ad-tag">WATCH AD</span>
          </button>
          <button id="btn-swap" class="powerup-btn powerup-btn-swap" title="Swap tray for 3 pure-color stacks">
            <span>🔄 Swap Hand</span>
            <span class="ad-tag">WATCH AD</span>
          </button>
          <button id="btn-unlock" class="powerup-btn powerup-btn-unlock" title="Unlock 2 VIP border cells">
            <span>🔓 Unlock VIP</span>
            <span class="ad-tag">WATCH AD</span>
          </button>
        </div>

        <!-- Out of Space Modal -->
        <div id="modal-outofspace" class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-card">
            <div class="modal-title modal-title-danger">OUT OF SPACE!</div>
            <div class="modal-subtitle">NO EMPTY SLOTS REMAIN ON BOARD</div>

            <div class="modal-stats">
              <div class="modal-stat-item">
                <span class="modal-stat-label">CURRENT SCORE</span>
                <span id="oos-score" class="modal-stat-val">0</span>
              </div>
              <div class="modal-stat-item">
                <span class="modal-stat-label">LEVEL</span>
                <span id="oos-level" class="modal-stat-val">1</span>
              </div>
            </div>

            <div class="modal-btn-group">
              <button id="btn-revive-clear" class="modal-btn btn-revive">
                <span>✨ Revive (Vaporize 2 Stacks)</span>
                <span class="ad-tag">WATCH AD</span>
              </button>
              <button id="btn-revive-vip" class="modal-btn btn-primary">
                <span>🔓 Unlock VIP Cells</span>
                <span class="ad-tag">WATCH AD</span>
              </button>
              <button id="btn-restart-game" class="modal-btn btn-secondary">
                <span>🔄 Restart Level</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Level Complete Modal -->
        <div id="modal-levelcomplete" class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal-card">
            <div class="modal-title">LEVEL COMPLETE! 🎉</div>
            <div class="modal-subtitle">ALL GOAL TILES COLLECTED</div>

            <div class="modal-stats">
              <div class="modal-stat-item">
                <span class="modal-stat-label">CLEARED LEVEL</span>
                <span id="lc-level" class="modal-stat-val">1</span>
              </div>
              <div class="modal-stat-item">
                <span class="modal-stat-label">TOTAL SCORE</span>
                <span id="lc-score" class="modal-stat-val">0</span>
              </div>
            </div>

            <div class="modal-btn-group">
              <button id="btn-next-level" class="modal-btn btn-primary">
                <span>🚀 NEXT LEVEL</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
